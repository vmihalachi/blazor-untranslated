name: CI

# Builds the fixture components in tests/Fixtures with the packed analyzer on every supported SDK. A Razor compiler
# that changes the shape of its generated code is the main way UNT001 could go silent, so each SDK gets its own job.
on:
  push:
    branches:
      - main
    paths-ignore:
      - "site/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths-ignore:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  test:
    name: Fixtures on .NET ${{ matrix.sdk }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: ["8.0", "9.0", "10.0"]
    steps:
      - uses: actions/checkout@v7

      # The repository's own SDK (global.json) runs the tests; the matrix SDK builds the fixtures.
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: ${{ matrix.sdk }}.x

      - name: Check formatting
        if: matrix.sdk == '10.0'
        run: dotnet format --verify-no-changes

      - name: Test
        env:
          UNTRANSLATED_FIXTURE_SDK: ${{ matrix.sdk }}
        run: dotnet test -c Release
